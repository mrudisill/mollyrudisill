<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <!-- felt / pressed-paper texture: a soft lit relief, multiplied over each folder's color -->
  <filter id="felt" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03 0.045" numOctaves="5" seed="7" stitchTiles="stitch" result="lumps"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="2" stitchTiles="stitch" result="fibers"/>
    <feComposite in="lumps" in2="fibers" operator="arithmetic" k2="0.75" k3="0.35" result="mix"/>
    <feDiffuseLighting in="mix" lighting-color="#fff" surfaceScale="2.2" result="lit">
      <feDistantLight azimuth="235" elevation="60"/>
    </feDiffuseLighting>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.12" intercept="0.02"/>
      <feFuncG type="linear" slope="1.12" intercept="0.02"/>
      <feFuncB type="linear" slope="1.12" intercept="0.02"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#felt)"/>
</svg>
